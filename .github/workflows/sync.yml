name: sync

# Pulls fresh listings from every source and writes to Turso.
# Runs every 30 minutes — the sync itself takes ~5-10 min so going faster
# would mean we're constantly syncing. Crank this up or down by editing the
# cron expression below.
#
# Manual trigger: Actions tab → "sync" → "Run workflow".

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run sync
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run sync
