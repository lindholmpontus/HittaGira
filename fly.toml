# fly.toml — Fly.io app config for HittaGira
#
# Before first deploy:
#   1. fly auth login
#   2. Replace `<your-app-name>` below with the name you pick
#   3. fly volumes create hittagira_data --size 1 --region arn
#   4. fly secrets set SYNC_TOKEN=$(openssl rand -hex 32)
#   5. fly deploy
#   6. fly ssh console -C "cd /app/_full && npm run db:migrate && npm run db:seed && npm run sync"

app = "<your-app-name>"
primary_region = "arn"  # Stockholm — closest to most users + sources

[build]

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/hittagira.db"

[[mounts]]
  source = "hittagira_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"     # Save credits — wakes on first request
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
